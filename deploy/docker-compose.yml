services:
  worker-pool-memory:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "9300:9300"
    environment:
      MUXCORE_GRPC_ADDR: core:9090
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
      MUXCORE_MODULE_ID: worker-pool-memory
      WORKER_POOL_HTTP_ADDR: "0.0.0.0:9300"
      WORKER_POOL_API_TOKEN: "${WORKER_POOL_API_TOKEN:-dev-token-change-me}"
    restart: unless-stopped
